<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Emberfall RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap" class="game-frame">
    <canvas id="c" width="640" height="400"></canvas>

    <!-- Player HUD -->
    <div class="hud hud-player">
      <div class="portrait">⚔</div>
      <div class="player-info">
        <div class="level-line"><b id="hudJob">Novice</b><span>Lv. <b id="hudLevel">1</b></span></div>
        <div class="bar hp"><i></i></div>
        <div class="bar sp"><i></i></div>
        <div class="bar xp"><i></i></div>
        <div class="tiny-stats"><span>❤ <b id="hudHp">100/100</b></span><span>◆ <b id="hudSp">30/30</b></span></div>
      </div>
    </div>

    <div class="hud zone-info">
      <div class="zone-name">EMBERFALL</div>
      <div class="zone-sub">Prontera Field</div>
    </div>

    <!-- Top-right buttons (all devices) -->
    <div class="topbtns">
      <button id="binv" class="round" title="Inventory (I)">🎒</button>
      <button id="bq" class="round" title="Quests (J)">📜</button>
      <button id="blb" class="round" title="Leaderboard">🏆</button>
      <button id="mu" class="round" title="Sound (M)">🔊</button>
      <button id="fs" class="round" title="Fullscreen (F)">⛶</button>
      <button id="blo" class="round" title="Log out">🚪</button>
    </div>

    <!-- PC only: control reference -->
    <div class="pc-only controls-help">
      <b>CONTROLS</b>
      <span><kbd>W A S D</kbd> / <kbd>Arrows</kbd> Move</span>
      <span><kbd>Space</kbd> Attack</span>
      <span><kbd>1</kbd> Bash &nbsp; <kbd>2</kbd> Magnum Break</span>
      <span><kbd>E</kbd> Talk to NPC</span>
      <span><kbd>Q</kbd> Red Potion &nbsp; <kbd>R</kbd> Blue Potion</span>
      <span><kbd>I</kbd> Inventory &nbsp; <kbd>J</kbd> Quests</span>
      <span><kbd>M</kbd> Sound &nbsp; <kbd>F</kbd> Fullscreen</span>
      <span>Mouse: hold click to walk</span>
    </div>

    <!-- Action buttons: hotbar on PC, thumb cluster on mobile -->
    <div class="actions">
      <button id="talk" class="skill"><b>E</b><span>💬</span><small>Talk</small></button>
      <button id="pot" class="skill"><b>Q</b><span>🧪</span><small>Potion</small></button>
      <button id="bsh" class="skill"><b>1</b><span>⚔</span><small>Bash</small></button>
      <button id="bmb" class="skill"><b>2</b><span>🔥</span><small>Magnum</small></button>
      <button id="atk" class="attack"><b>SPACE</b><span>⚔️</span><small>ATTACK</small></button>
    </div>

    <!-- Mobile only: virtual joystick -->
    <div id="joy" class="touch-only joystick"><div id="joyk"></div></div>

    <div id="auth" class="auth">
      <div class="auth-box">
        <h2>EMBERFALL</h2>
        <p>Log in or create an account</p>
        <input id="an" placeholder="Username" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false">
        <input id="ap" type="password" placeholder="Password" maxlength="64" autocomplete="current-password">
        <div id="ae" class="auth-err"></div>
        <div class="auth-btns"><button id="lg">Log in</button><button id="rg">Register</button></div>
      </div>
    </div>

    <div id="panel" class="modal" hidden>
      <div class="modal-head">
        <div>
          <span class="eyebrow">EMBERFALL</span>
          <h2 id="pt"></h2>
        </div>
        <button id="px" class="close-btn">×</button>
      </div>
      <div id="pb" class="modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game.js"></script>
  <script src="online.js"></script>
</body>
</html>
