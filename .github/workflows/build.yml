name: Build apps
on:
  workflow_dispatch:        # run manually: Actions tab > Build apps > Run workflow
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create Android project
        working-directory: app-android
        run: |
          npm install
          npx cap add android
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
      - name: App icon (non-fatal)
        continue-on-error: true
        working-directory: app-android
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#11151d' --iconBackgroundColorDark '#11151d'
      - name: Build APK
        working-directory: app-android
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Emberfall-Android-APK
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build EXE
        working-directory: app-windows
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Emberfall-Windows-EXE
          path: app-windows/dist/*.exe
          
